name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download
      - name: Lint formatting
        run: |
          FMT_FILES="$(gofmt -l .)"
          if [ -n "$FMT_FILES" ]; then
            echo "Files not formatted:"
            echo "$FMT_FILES"
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...
